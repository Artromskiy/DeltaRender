name: Build, tests and benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run registered BenchmarkDotNet projects
        required: true
        default: false
        type: boolean
      filter:
        description: BenchmarkDotNet filter
        required: true
        default: "*"
        type: string
      warmup_count:
        required: true
        default: 3
        type: number
      iteration_count:
        required: true
        default: 5
        type: number
      launch_count:
        required: true
        default: 1
        type: number

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-render-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: DeltaRender
      - name: Checkout DeltaShader sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Checkout DeltaMaths shader contract
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaXAML sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Check package boundaries
        working-directory: DeltaRender
        run: ./eng/check-package-boundaries.sh
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages
        working-directory: DeltaRender
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github-artromskiy \
            --username "${{ github.repository_owner }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-render-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: delta-render-nuget-${{ runner.os }}-
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y jq glslang-tools spirv-tools mesa-vulkan-drivers vulkan-tools
      - name: Materialize Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          printf '%s' "$SIXLABORS_LICENSE" > "$RUNNER_TEMP/sixlabors.lic"
          echo "SixLaborsLicenseFile=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"
      - name: Prepare current Render packages
        working-directory: DeltaRender
        env:
          NUGET_GITHUB_SOURCE: https://nuget.pkg.github.com/Artromskiy/index.json
        run: ./eng/prepare-ci-packages.sh "$RUNNER_TEMP/delta-render-packages"
      - name: Restore and build
        working-directory: DeltaRender
        run: |
          dotnet restore DeltaRender.slnx \
            --source "$RUNNER_TEMP/delta-render-packages" \
            --source https://api.nuget.org/v3/index.json \
            --source https://nuget.pkg.github.com/Artromskiy/index.json \
            --ignore-failed-sources
          dotnet build DeltaRender.slnx -c Release --no-restore
      - name: Run tests
        working-directory: DeltaRender
        run: dotnet test tests/DeltaRender.Tests/DeltaRender.Tests.csproj -c Release --no-build --no-restore
      - name: Benchmark discovery smoke
        shell: bash
        working-directory: DeltaRender
        run: |
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- --list flat --filter '*'
          done

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run registered benchmarks
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          if [ ${#projects[@]} -eq 0 ]; then
            echo 'No *.Benchmarks.csproj is registered.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- \
              --filter '${{ inputs.filter }}' \
              --warmupCount '${{ inputs.warmup_count }}' \
              --iterationCount '${{ inputs.iteration_count }}' \
              --launchCount '${{ inputs.launch_count }}' \
              --exporters json csv markdown github \
              --artifacts artifacts/benchmarks
          done
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-render-benchmarks-${{ github.run_number }}
          path: artifacts/benchmarks
          if-no-files-found: warn
          retention-days: 30
