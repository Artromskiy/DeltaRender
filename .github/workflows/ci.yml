name: Build, tests and benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run registered BenchmarkDotNet projects
        required: true
        default: false
        type: boolean
      filter:
        description: BenchmarkDotNet filter
        required: true
        default: "*"
        type: string
      warmup_count:
        required: true
        default: 3
        type: number
      iteration_count:
        required: true
        default: 5
        type: number
      launch_count:
        required: true
        default: 1
        type: number

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-render-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SIXLABORS_FONTS_COMMIT: c68b27d683c701ca254d5cfc6487c699954f19ff
  SIXLABORS_FONTS_PACKAGE_VERSION: 3.1.0-source.c68b27d

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: DeltaRender
      - name: Checkout DeltaShader sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Checkout DeltaMaths shader contract
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaXAML sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Checkout DeltaDiagnostics sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Checkout DeltaText sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaText
          path: DeltaText
      - name: Check package boundaries
        working-directory: DeltaRender
        run: ./eng/check-package-boundaries.sh
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-render-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: delta-render-nuget-${{ runner.os }}-
      - name: Install software Vulkan build dependencies
        run: sudo apt-get update && sudo apt-get install -y jq cmake ninja-build glslang-tools spirv-tools vulkan-tools ripgrep
      - name: Checkout SwiftShader
        uses: actions/checkout@v7
        with:
          repository: google/swiftshader
          ref: 694585a05946e1ed49b6bd577ca6537cbb57f025
          path: third_party/SwiftShader
      - name: Build SwiftShader
        run: |
          cmake -S third_party/SwiftShader -B third_party/SwiftShader/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build third_party/SwiftShader/build --target vk_swiftshader --parallel 2
          swiftshader_library="$(find third_party/SwiftShader/build -type f -name 'libvk_swiftshader.so' -print -quit)"
          test -n "$swiftshader_library"
          swiftshader_manifest="$(find third_party/SwiftShader -type f -name 'vk_swiftshader_icd.json' -print -quit)"
          test -n "$swiftshader_manifest"
          swiftshader_library="$(realpath "$swiftshader_library")"
          jq --arg library "$swiftshader_library" '.ICD.library_path = $library' "$swiftshader_manifest" > "$RUNNER_TEMP/vk_swiftshader_icd.json"
          echo "SWIFTSHADER_ICD=$RUNNER_TEMP/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
      - name: Materialize Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::Repository secret SIXLABORS_LICENSE is required for the build-time SixLabors.Fonts package."
            exit 1
          fi
          printf '%s' "$SIXLABORS_LICENSE" > "$RUNNER_TEMP/sixlabors.lic"
          echo "SixLaborsLicenseFile=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"
      - name: Checkout pinned SixLabors Fonts fork
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/Fonts
          ref: ${{ env.SIXLABORS_FONTS_COMMIT }}
          path: third_party/SixLabors.Fonts
      - name: Restore SixLabors build infrastructure
        run: git -C third_party/SixLabors.Fonts submodule update --init --recursive shared-infrastructure
      - name: Pack pinned SixLabors Fonts fork
        run: |
          dotnet pack third_party/SixLabors.Fonts/src/SixLabors.Fonts/SixLabors.Fonts.csproj \
            -c Release \
            --output "$RUNNER_TEMP/sixlabors-feed" \
            -p:PackageId=SixLabors.Fonts.Delta \
            -p:PackageVersion="$SIXLABORS_FONTS_PACKAGE_VERSION" \
            -p:MinVerVersionOverride="$SIXLABORS_FONTS_PACKAGE_VERSION" \
            -p:RepositoryUrl=https://github.com/Artromskiy/Fonts \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false
      - name: Prepare current Render packages
        working-directory: DeltaRender
        env:
          NUGET_GITHUB_SOURCE: https://nuget.pkg.github.com/Artromskiy/index.json
          SIXLABORS_FONTS_SOURCE: ${{ runner.temp }}/sixlabors-feed
        run: ./eng/prepare-ci-packages.sh "$RUNNER_TEMP/delta-render-packages"
      - name: Restore and build
        working-directory: DeltaRender
        run: |
          dotnet restore DeltaRender.slnx \
            --source "$RUNNER_TEMP/delta-render-packages" \
            --source https://api.nuget.org/v3/index.json \
            --source https://nuget.pkg.github.com/Artromskiy/index.json \
            --force-evaluate \
            --ignore-failed-sources
          dotnet build DeltaRender.slnx -c Release --no-restore
      - name: Run tests on SwiftShader
        working-directory: DeltaRender
        run: ./eng/run-software-vulkan.sh --driver swiftshader
      - name: Upload software Vulkan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-render-software-vulkan-${{ github.run_number }}
          path: DeltaRender/artifacts/software-vulkan
          if-no-files-found: warn
          retention-days: 14
      - name: Benchmark discovery smoke
        shell: bash
        working-directory: DeltaRender
        run: |
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- --list flat --filter '*'
          done

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run registered benchmarks
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          if [ ${#projects[@]} -eq 0 ]; then
            echo 'No *.Benchmarks.csproj is registered.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- \
              --filter '${{ inputs.filter }}' \
              --warmupCount '${{ inputs.warmup_count }}' \
              --iterationCount '${{ inputs.iteration_count }}' \
              --launchCount '${{ inputs.launch_count }}' \
              --exporters json csv markdown github \
              --artifacts artifacts/benchmarks
          done
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-render-benchmarks-${{ github.run_number }}
          path: artifacts/benchmarks
          if-no-files-found: warn
          retention-days: 30
