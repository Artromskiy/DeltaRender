name: Code metrics

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  metrics:
    name: .NET code metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: DeltaRender
      - name: Checkout DeltaShader sibling
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Checkout DeltaMaths sibling
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaXAML sibling
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaXAML
          path: DeltaXAML
      - name: Checkout DeltaDiagnostics sibling
        uses: actions/checkout@v5
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Configure GitHub Packages
        working-directory: DeltaRender
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github-artromskiy \
            --username "${{ github.repository_owner }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
      - name: Install shader and Vulkan tools
        run: sudo apt-get update && sudo apt-get install -y jq glslang-tools spirv-tools mesa-vulkan-drivers vulkan-tools
      - name: Materialize Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          printf '%s' "$SIXLABORS_LICENSE" > "$RUNNER_TEMP/sixlabors.lic"
          echo "SixLaborsLicenseFile=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"
      - name: Prepare current Render packages
        working-directory: DeltaRender
        env:
          NUGET_GITHUB_SOURCE: https://nuget.pkg.github.com/Artromskiy/index.json
        run: ./eng/prepare-ci-packages.sh "$RUNNER_TEMP/delta-render-packages"
      - name: Restore
        working-directory: DeltaRender
        run: |
          dotnet restore DeltaRender.slnx \
            --source "$RUNNER_TEMP/delta-render-packages" \
            --source https://api.nuget.org/v3/index.json \
            --source https://nuget.pkg.github.com/Artromskiy/index.json \
            --force-evaluate \
            --ignore-failed-sources
      - name: Verify formatting
        continue-on-error: true
        working-directory: DeltaRender
        run: |
          mkdir -p artifacts/code-metrics
          dotnet format whitespace --folder . --exclude ./obj --exclude ./bin --exclude ./artifacts --verify-no-changes --verbosity minimal 2>&1 | tee artifacts/code-metrics/format.log
      - name: Build and collect analyzer metrics
        shell: bash
        working-directory: DeltaRender
        run: |
          set -uo pipefail
          mkdir -p artifacts/code-metrics; set +e
          dotnet build DeltaRender.slnx -c Release --no-restore \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false \
            /p:AnalysisMode=AllEnabledByDefault \
            "/p:ErrorLog=${GITHUB_WORKSPACE}/DeltaRender/artifacts/code-metrics/diagnostics.sarif,version=2.1" \
            2>&1 | tee artifacts/code-metrics/build.log
          status=${PIPESTATUS[0]}; set -e
          echo "Build exit code: $status" | tee artifacts/code-metrics/summary.txt; exit 0
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-metrics
          path: DeltaRender/artifacts/code-metrics
          if-no-files-found: warn
